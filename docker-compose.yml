version: '3.8'

services:
  # Servicio de Backend (NestJS + TypeORM)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typeorm-mssql-backend
    restart: unless-stopped
    # Leer variables de entorno desde el archivo .env local
    env_file:
      - .env
    # Mapeo de puertos (4100 del contenedor expuesto al puerto 4100 del host)
    ports:
      - "4100:4100"
    # Volumen persistente para almacenar las cargas estáticas de los usuarios
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

# Redes de Docker para comunicación interna segura
networks:
  app-network:
    driver: bridge
